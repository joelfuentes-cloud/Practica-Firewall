services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "3000:3000/tcp"
      - "443:443/tcp"
    volumes:
      - ./workdata:/opt/adguardhome/work
      - ./confdir:/opt/adguardhome/conf